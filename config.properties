# Scaling mode: nearest (sharp, arbitrary size) or integer (sharp, whole multipliers only)
scale=nearest

# The window is desktop-landscape. The game itself stays portrait (the MIDlet
# explicitly does not support landscape gameplay), so it is centered and scaled
# to the available height. No on-screen keypad is shown; use the keyboard.
window.width=1280
window.height=800
window.maximized=true

# Minimum delay between --screenshot captures, in milliseconds.
screenshot.interval.ms=300
